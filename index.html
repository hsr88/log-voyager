  <!-- SPA GitHub Pages Redirect Script -->
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License
    // https://github.com/rafgraph/spa-github-pages
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>

  <style id="critical-shell-styles">
    :root {
      --color-paper: oklch(14% 0.014 258);
      --color-panel: oklch(19% 0.018 258);
      --color-rule: oklch(31% 0.018 258);
      --color-muted: oklch(70% 0.018 258);
      --color-ink: oklch(95% 0.008 250);
      --font-display: "Space Grotesk", "IBM Plex Sans", sans-serif;
      --font-body: "IBM Plex Sans", "Space Grotesk", sans-serif;
    }
    html { color-scheme: dark; }
    html, body, #root { min-height: 100%; margin: 0; background: var(--color-paper); color: var(--color-ink); }
    body { overflow-x: clip; font-family: var(--font-body); }
    .static-seo { min-height: 100vh; background: var(--color-paper); color: var(--color-ink); }
    .static-seo > header { min-height: 4.5rem; padding-inline: max(1rem, calc((100% - 76rem) / 2)); display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; border-bottom: 1px solid var(--color-rule); }
    .static-seo > header a { color: var(--color-ink); text-decoration: none; }
    .static-seo > header > a { font-family: var(--font-display); font-weight: 700; }
    .static-seo > header nav { display: flex; align-items: center; gap: 1rem; }
    .static-seo > main, .static-seo > footer { width: min(100% - 2rem, 76rem); margin-inline: auto; }
    .static-seo > main { padding-block: 4rem; }
    .static-seo article { max-width: 70ch; }
    .static-seo h1, .static-seo h2, .static-seo h3 { font-family: var(--font-display); }
    .static-seo h1 { margin: 0 0 1.5rem; font-size: clamp(2.5rem, 7vw, 5rem); line-height: 1; }
    .static-seo p, .static-seo li { color: var(--color-muted); line-height: 1.65; }
    @media (max-width: 48rem) { .static-seo > header nav { display: none; } }
  </style>
